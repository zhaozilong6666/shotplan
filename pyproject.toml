[build-system]
# 77+ understands the SPDX string form of `license` and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shotplan"
version = "0.10.1"
description = "An evaluable, constraint-aware agent that turns a vague photoshoot brief into an executable plan"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shotplan contributors" }]
keywords = ["agent", "llm", "evaluation", "structured-output", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
shotplan = "shotplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shotplan" = ["web/*", "py.typed"]
"shotplan.knowledge" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must adjust sys.path before importing the package under test.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/shotplan"]
mypy_path = "src"
# The API extra is optional, so its stubs may be absent in a bare install.
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
