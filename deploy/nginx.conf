# One upstream per single-worker uvicorn instance. Do not replace this with
# `uvicorn --workers N` on Windows: the shared accept socket produced 30s
# stalls (E30). Start instances with:
#   systemctl enable --now shotplan@8101 shotplan@8102 shotplan@8103 shotplan@8104
upstream shotplan_api {
    least_conn;
    server 127.0.0.1:8101 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8102 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8103 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8104 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location / {
        proxy_pass http://shotplan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Do not retry POSTs: a retried plan can duplicate provider spend.
    }
}
