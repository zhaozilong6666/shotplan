name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Lint
        run: python -m ruff check src tests evals

      - name: Unit tests
        run: python -m pytest

      - name: Evaluation gate
        run: python -m evals.run_eval --write-report

      - name: Repair-loop gate
        run: python -m evals.repair_lab --check

      - name: Failure-library gate
        run: python -m evals.collect_failures --check

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.python-version }}
          path: |
            evals/out/latest.json
            docs/eval-report.md
