name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Lint
        run: python -m ruff check src tests evals scripts

      - name: Unit tests
        run: python -m pytest --cov=src/shotplan --cov-report=term-missing --cov-fail-under=85

  gates:
    # The heavy gates are statistical/performance experiments. Running them on
    # every interpreter multiplies CI time and flakiness without adding signal:
    # their thresholds do not depend on the Python minor version.
    name: quality gates (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Type check
        run: python -m mypy

      - name: Evaluation gate
        run: python -m evals.run_eval --write-report

      - name: Mutation gate (are the gates themselves effective?)
        run: python -m evals.mutation_lab --check

      - name: Repair-loop gate
        run: python -m evals.repair_lab --check

      - name: Failure-library gate
        run: python -m evals.collect_failures --check

      - name: Case-mining gate (holdout challenge set)
        run: python -m evals.case_miner --check

      - name: Fuzz gate
        run: python -m evals.fuzz --check --iterations 500

      - name: Benchmark gate
        run: python -m evals.benchmark --check

      - name: Concurrency gate
        run: python -m evals.loadtest --check --requests 30

      - name: Scaling gate
        run: python -m evals.scaling --check --requests 300 --workers 1 2

      - name: Real HTTP load gate
        run: python -m evals.http_load --check

      - name: Worker/persistence controlled experiment
        run: python -m evals.worker_lab --check

      - name: Write-behind persistence gate
        run: python -m evals.persist_lab --check

      - name: Pipeline contract doc is generated from code
        run: python scripts/build_pipeline_doc.py --check

      - name: Examples are up to date
        run: python -m evals.examples --check

      - name: Showcase is up to date
        run: |
          python -m evals.cost_latency
          python scripts/build_showcase.py
          git diff --exit-code docs/index.html

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-py3.12
          path: |
            evals/out/latest.json
            docs/eval-report.md
