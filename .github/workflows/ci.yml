name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Lint
        run: python -m ruff check src tests evals scripts

      - name: Unit tests
        run: python -m pytest --cov=src/shotplan --cov-report=term-missing --cov-fail-under=85

  gates:
    # The heavy gates are statistical/performance experiments. Running them on
    # every interpreter multiplies CI time and flakiness without adding signal:
    # their thresholds do not depend on the Python minor version.
    name: quality gates (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Type check
        run: python -m mypy

      # The gate list lives in exactly one place: the Makefile. Keeping a
      # hand-copied list here is how CI drifted to 17 gates while the Makefile
      # ran 25 and README claimed 25 -- three numbers, none of them equal.
      #
      # The tee is not decoration: one run failed on an flaky gate and the only
      # thing left to diagnose it with was "make gates exited 1". pipefail keeps
      # the step red while the log survives into the artifact.
      - name: "All quality gates (single source of truth: Makefile)"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evals/out
          make gates 2>&1 | tee evals/out/gates.log

      - name: No generated artifact is stale
        run: git diff --exit-code

      - name: Showcase page is generated from the archived numbers
        run: |
          python -m evals.cost_latency
          python scripts/build_showcase.py
          git diff --exit-code docs/index.html

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-py3.12
          path: |
            evals/out/latest.json
            evals/out/gates.log
            docs/eval-report.md
